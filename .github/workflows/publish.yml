name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Lint packages
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check package contents
        run: pnpm package:check

      - name: Check release tag version
        run: pnpm release:check "${{ github.ref_name }}"

  publish:
    name: Publish package and GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish @keepkit/core to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if npm view "@keepkit/core@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@keepkit/core@${version} is already published; skipping."
          else
            pnpm --filter "@keepkit/core" publish \
              --access public \
              --provenance \
              --no-git-checks
          fi

      - name: Wait for @keepkit/core to be available on npm
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 60); do
            published_version="$(npm view "@keepkit/core@${version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published_version" = "$version" ]; then
              echo "@keepkit/core@${version} is available on npm."
              exit 0
            fi
            echo "Waiting for @keepkit/core@${version} to propagate (attempt ${attempt}/60)."
            sleep 10
          done
          echo "Timed out waiting for @keepkit/core@${version} to propagate." >&2
          exit 1

      - name: Publish @keepkit/ui to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if npm view "@keepkit/ui@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@keepkit/ui@${version} is already published; skipping."
          else
            pnpm --filter "@keepkit/ui" publish \
              --access public \
              --provenance \
              --no-git-checks
          fi

      - name: Wait for @keepkit/ui to be available on npm
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for attempt in $(seq 1 60); do
            published_version="$(npm view "@keepkit/ui@${version}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$published_version" = "$version" ]; then
              echo "@keepkit/ui@${version} is available on npm."
              exit 0
            fi
            echo "Waiting for @keepkit/ui@${version} to propagate (attempt ${attempt}/60)."
            sleep 10
          done
          echo "Timed out waiting for @keepkit/ui@${version} to propagate." >&2
          exit 1

      - name: Verify npm latest versions and clean installation
        run: pnpm release:published-check "${{ github.ref_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ github.ref_name }} already exists; skipping."
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
