name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Lint packages
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check package contents
        run: pnpm package:check

      - name: Check release tag version
        run: pnpm release:check "${{ github.ref_name }}"

  publish:
    name: Publish package and GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for package_name in @keepkit/core @keepkit/ui; do
            if npm view "${package_name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
            else
              pnpm --filter "${package_name}" publish \
                --access public \
                --provenance \
                --no-git-checks
            fi
          done

      - name: Verify published packages from an isolated directory
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          cd "$verification_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-package-lock @keepkit/core@latest @keepkit/ui@latest
          node --input-type=module -e "await import('@keepkit/core/core'); await import('@keepkit/core/react'); await import('@keepkit/ui');"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ github.ref_name }} already exists; skipping."
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
